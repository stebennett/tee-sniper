apiVersion: v1
kind: Service
metadata:
  name: {{ include "tee-sniper-api.fullname" . }}
  labels:
    {{- include "tee-sniper-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "tee-sniper-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
