[project]
name = "tee-sniper-mcp"
dynamic = ["version"]
description = "Local MCP server that exposes tee-sniper booking operations to LLM clients."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "fastmcp>=3.1.0",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "cryptography>=43",
]

[project.scripts]
tee-sniper-mcp = "tee_sniper_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # Required transitively by the cross-package roundtrip test in
    # tests/test_auth.py: importing app.services.encryption triggers
    # api/app/services/__init__.py which imports session_manager (uses redis).
    "redis>=7.4.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "..", tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$" }

[tool.hatch.build.hooks.vcs]
version-file = "src/tee_sniper_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tee_sniper_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
