[project]
name = "tee-sniper-mcp"
version = "0.1.0"
description = "Local MCP server that exposes tee-sniper booking operations to LLM clients."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "fastmcp>=3.1.0",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "cryptography>=43",
]

[project.scripts]
tee-sniper-mcp = "tee_sniper_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "redis>=7.4.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tee_sniper_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
