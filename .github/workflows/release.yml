name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2

    - name: Get version from tag
      id: version
      run: |
        echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "VERSION_NUMBER=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Build MCP wheel + sdist
      run: |
        cd mcp
        uv build

    - name: Verify MCP wheel version matches tag
      run: |
        tag="${{ steps.version.outputs.VERSION_NUMBER }}"
        whl=$(ls mcp/dist/*.whl)
        case "$(basename "$whl")" in
          tee_sniper_mcp-${tag}-*) echo "ok: $whl" ;;
          *) echo "wheel $whl does not match tag $tag"; exit 1 ;;
        esac

    - name: Resolve MCP artefact paths
      id: mcp_artefacts
      run: |
        wheel=$(ls mcp/dist/*.whl)
        sdist=$(ls mcp/dist/*.tar.gz)
        echo "wheel=${wheel}" >> "$GITHUB_OUTPUT"
        echo "wheel_name=$(basename "${wheel}")" >> "$GITHUB_OUTPUT"
        echo "sdist=${sdist}" >> "$GITHUB_OUTPUT"
        echo "sdist_name=$(basename "${sdist}")" >> "$GITHUB_OUTPUT"

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        release_name: Release ${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false

    - name: Upload MCP wheel
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.mcp_artefacts.outputs.wheel }}
        asset_name: ${{ steps.mcp_artefacts.outputs.wheel_name }}
        asset_content_type: application/zip

    - name: Upload MCP sdist
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.mcp_artefacts.outputs.sdist }}
        asset_name: ${{ steps.mcp_artefacts.outputs.sdist_name }}
        asset_content_type: application/gzip

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry (Push)
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Container Registry (dhi.io)
      uses: docker/login-action@v4
      with:
        registry: dhi.io
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata for API Docker image
      id: meta-api
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest

    - name: Build and push API Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./api
        push: true
        tags: ${{ steps.meta-api.outputs.tags }}
        labels: ${{ steps.meta-api.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Extract metadata for MCP Docker image
      id: meta-mcp
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mcp
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest

    - name: Build and push MCP Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./mcp/Dockerfile
        push: true
        tags: ${{ steps.meta-mcp.outputs.tags }}
        labels: ${{ steps.meta-mcp.outputs.labels }}
        build-args: |
          VERSION=${{ steps.version.outputs.VERSION_NUMBER }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Extract metadata for Web Docker image
      id: meta-web
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest

    - name: Build and push Web Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./web
        push: true
        tags: ${{ steps.meta-web.outputs.tags }}
        labels: ${{ steps.meta-web.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
