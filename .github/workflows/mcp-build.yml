name: MCP Build and Test

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-build.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: |
          cd mcp
          uv sync --all-extras --dev

      - name: Run tests
        run: |
          cd mcp
          uv run pytest -v

  wheel:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build wheel + sdist
        run: |
          cd mcp
          uv build

      - name: Smoke-install wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install mcp/dist/*.whl
          /tmp/smoke/bin/tee-sniper-mcp --version

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-dist-${{ github.sha }}
          path: mcp/dist/*
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./mcp/Dockerfile
          push: false
          tags: tee-sniper-mcp:${{ github.sha }}
          build-args: |
            VERSION=0.0.0+ci.${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
